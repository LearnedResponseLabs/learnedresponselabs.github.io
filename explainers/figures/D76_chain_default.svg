<svg xmlns="http://www.w3.org/2000/svg" height="330" viewBox="0 0 340 330" width="340"><rect fill="none" height="34" rx="4" stroke="currentColor" stroke-opacity="0.7" width="300" x="20" y="8"/><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="19">θ in the gauge slice S</text><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="32">θ/π = (0, 0.1, 0.7, 0.3, 0.8)</text><g><line stroke="#2b6cb0" stroke-width="1.400000" x1="40.000000" x2="40.000000" y1="42.000000" y2="55.200000"/><polygon fill="#2b6cb0" points="40.000000,64.000000 36.040000,55.200000 43.960000,55.200000"/></g><text dominant-baseline="central" fill="#2b6cb0" font-size="10" text-anchor="start" x="52" y="53">Meas — hMeas (continuous), honto (onto Crit)</text><rect fill="none" height="34" rx="4" stroke="currentColor" stroke-opacity="0.7" width="300" x="20" y="64"/><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="75">Meas θ ∈ Crit (synthetic: the necklace-log vector)</text><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="88">(-1.34, -0.21, -0.64, 0, -0.8)</text><g><line stroke="#2b6cb0" stroke-width="1.400000" x1="40.000000" x2="40.000000" y1="98.000000" y2="111.200000"/><polygon fill="#2b6cb0" points="40.000000,120.000000 36.040000,111.200000 43.960000,111.200000"/></g><text dominant-baseline="central" fill="#2b6cb0" font-size="10" text-anchor="start" x="52" y="109">N — hN (continuous; here the inclusion)</text><rect fill="none" height="34" rx="4" stroke="currentColor" stroke-opacity="0.7" width="300" x="20" y="120"/><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="131">N(Meas θ) = full pair sum + c·1 (hlog), c = 0</text><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="144">(-1.34, -0.21, -0.64, 0, -0.8)</text><g><line stroke="#2b6cb0" stroke-width="1.400000" x1="40.000000" x2="40.000000" y1="154.000000" y2="167.200000"/><polygon fill="#2b6cb0" points="40.000000,176.000000 36.040000,167.200000 43.960000,167.200000"/></g><text dominant-baseline="central" fill="#2b6cb0" font-size="10" text-anchor="start" x="52" y="165">R = P D — the recovery of S63</text><rect fill="none" height="34" rx="4" stroke="currentColor" stroke-opacity="0.7" width="300" x="20" y="176"/><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="187">R(N(Meas θ)) = G(θ)   (derived from hlog)</text><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="200">(0.64, -0.8, 1.12, -0.53, -0.43)</text><g><line stroke="#2b6cb0" stroke-width="1.400000" x1="40.000000" x2="40.000000" y1="210.000000" y2="223.200000"/><polygon fill="#2b6cb0" points="40.000000,232.000000 36.040000,223.200000 43.960000,223.200000"/></g><text dominant-baseline="central" fill="#2b6cb0" font-size="10" text-anchor="start" x="52" y="221">g⁻¹ : G(S) → S — G inverted on the slice</text><rect fill="none" height="34" rx="4" stroke="#2f855a" stroke-opacity="0.7" width="300" x="20" y="232"/><text dominant-baseline="central" fill="#2f855a" font-size="10" text-anchor="middle" x="170" y="243">e⁻¹(Meas θ) = g⁻¹(P D N(Meas θ))</text><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="256">θ/π = (0, 0.1, 0.7, 0.3, 0.8)  ✓ = θ</text><text dominant-baseline="central" fill="currentColor" fill-opacity="0.6" font-size="10" text-anchor="start" x="8" y="284">Synthetic model: Meas is the necklace-log map and N the inclusion,</text><text dominant-baseline="central" fill="currentColor" fill-opacity="0.6" font-size="10" text-anchor="start" x="8" y="298">so the four hypotheses hold by construction; for Galashin's own map</text><text dominant-baseline="central" fill="currentColor" fill-opacity="0.6" font-size="10" text-anchor="start" x="8" y="312">they are the published results H1–H4, not computed here.</text></svg>
