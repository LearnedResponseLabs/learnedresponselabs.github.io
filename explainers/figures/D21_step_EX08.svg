<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 376" width="690" height="376" role="img" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="currentColor">
<title>The necklace step at the coloop, EX08</title>
<desc>The necklace recursion at the coloop p=3 of EX08 (labels counted from 1; Lean counts from 0, row 2 to row 3): I_3 minus p and then with sigma(p)=p put back is I_4 again, so I_3 = I_4 (necklaceAux_coloop_step); every set is the value Lean printed.</desc>
<metadata>{&quot;example&quot;: &quot;EX08&quot;, &quot;lean_lines&quot;: [&quot;S29EX08 window(1-based)=[5, 1, 3, 2, 4] n=5 coloops(1-based)=[3]&quot;, &quot;S29EX08 s_x (x=1..n)=[2, 4, 3, 5, 1]&quot;, &quot;S29EX08 coloop p=3 step: I_p (necklaceAux 2, Lean row 2)=[1, 3, 4, 5]&quot;, &quot;S29EX08 coloop p=3 step: I_p minus p=[1, 4, 5]&quot;, &quot;S29EX08 coloop p=3 step: after inserting sigma(p)=3=[1, 3, 4, 5]&quot;, &quot;S29EX08 coloop p=3 step: I_(p+1) (necklaceAux 3, Lean row 3)=[1, 3, 4, 5]&quot;], &quot;source&quot;: &quot;Lean output lines, verbatim&quot;}</metadata>
<defs><marker id="ahurrentColor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text x="107" y="40" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold" data-l="0" data-coloop="1">I_3</text>
<text x="257" y="40" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold">I_p minus p</text>
<text x="407" y="40" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold">after insert</text>
<text x="557" y="40" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold" data-l="0" data-coloop="+1">I_4</text>
