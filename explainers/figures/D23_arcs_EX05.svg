<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 255" width="870" height="255" role="img" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="currentColor">
<title>Rows where x is in I_r, as the arc (s_x, x], EX05</title>
<desc>For each label x of EX05 (labels and rows counted from 1; Lean counts from 0), the rows r with x in I_r are the rows of the arc (s_x, x] on the circle of row labels (filled), as in mem_necklace_iff; for the coloop s_x = x and the inArcC convention makes the arc the whole circle; the filled rows are the values Lean printed.</desc>
<metadata>{&quot;example&quot;: &quot;EX05&quot;, &quot;lean_lines&quot;: [&quot;S29EX05 window(1-based)=[2, 1, 3] n=3 coloops(1-based)=[3]&quot;, &quot;S29EX05 s_x (x=1..n)=[2, 1, 3]&quot;, &quot;S29EX05 inArcC rows per label x=1..n (paper rows)=[[1, 3], [2], [1, 2, 3]]&quot;, &quot;S29EX05 necklace rows I_1..I_n=[[1, 3], [2, 3], [1, 3]]&quot;], &quot;source&quot;: &quot;Lean output lines, verbatim&quot;}</metadata>
