<svg xmlns="http://www.w3.org/2000/svg" height="212" viewBox="0 0 340 212" width="340"><text dominant-baseline="central" fill="currentColor" font-size="11" text-anchor="middle" x="170" y="14">UF-ANALYTIC · the two-triangle cell, two components</text><text dominant-baseline="central" fill="currentColor" fill-opacity="0.6" font-size="9" text-anchor="middle" x="170" y="27">the eigenvalues of H on T (h = 0 at the anchors 1, 4)</text><line stroke="currentColor" stroke-opacity="0.5" x1="54" x2="320" y1="136" y2="136"/><rect fill="#2b6cb0" height="24.85" width="39.9" x="67.3" y="111.15"/><text dominant-baseline="central" fill="currentColor" font-size="9" text-anchor="middle" x="87.25" y="148">0.4985</text><rect fill="#2b6cb0" height="36.22" width="39.9" x="133.8" y="99.78"/><text dominant-baseline="central" fill="currentColor" font-size="9" text-anchor="middle" x="153.75" y="148">0.7265</text><rect fill="#2b6cb0" height="68.61" width="39.9" x="200.3" y="67.39"/><text dominant-baseline="central" fill="currentColor" font-size="9" text-anchor="middle" x="220.25" y="148">1.376</text><rect fill="#2b6cb0" height="100" width="39.9" x="266.8" y="36"/><text dominant-baseline="central" fill="currentColor" font-size="9" text-anchor="middle" x="286.75" y="148">2.006</text><text dominant-baseline="central" fill="currentColor" font-size="10" text-anchor="middle" x="170" y="166">dim T = 6 − 2 = 4 = dim W; 4 positive ✓</text><text dominant-baseline="central" fill="currentColor" fill-opacity="0.6" font-size="9" text-anchor="middle" x="170" y="179">so H maps T one-to-one onto W = im B. Since dR·dMeas = H on T,</text><text dominant-baseline="central" fill="currentColor" fill-opacity="0.6" font-size="9" text-anchor="middle" x="170" y="192">dMeas is injective: Meas is an immersion, and the analytic</text><text dominant-baseline="central" fill="currentColor" fill-opacity="0.6" font-size="9" text-anchor="middle" x="170" y="205">inverse function theorem gives the analytic inverse G⁻¹ ∘ R</text></svg>
