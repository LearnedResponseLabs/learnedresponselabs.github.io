<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="currentColor">
<title>Half-open arcs, EX02</title>
<desc>For each crossing edge p&gt;q of EX02, the rows where Lean's pairExponent column of M_N is -1 (filled), with the arc (s_p,s_q] in the centre taken from the printed s_x; the printed 'equal' test compares the column with the paper's rule.</desc>
<metadata>{&quot;example&quot;: &quot;EX02&quot;, &quot;lean_lines&quot;: [&quot;EX02 window(1-based)=[3, 5, 1, 2, 4] n=5 modulus=25 rank=3 coloops=[]&quot;, &quot;EX02 s_x (x=1..n)=[3, 4, 1, 5, 2]&quot;, &quot;EX02 crossEdges(paper labels)=[(1, 2), (2, 3), (2, 4), (3, 5), (4, 5), (5, 1), (5, 2)]&quot;, &quot;EX06 edge (1, 2) column of M_N = [0, 0, 0, -1, 0]  paper rule -1_(s_p,s_q] = [0, 0, 0, -1, 0]  equal: true&quot;, &quot;EX06 edge (2, 3) column of M_N = [-1, 0, 0, 0, -1]  paper rule -1_(s_p,s_q] = [-1, 0, 0, 0, -1]  equal: true&quot;, &quot;EX06 edge (2, 4) column of M_N = [0, 0, 0, 0, -1]  paper rule -1_(s_p,s_q] = [0, 0, 0, 0, -1]  equal: true&quot;, &quot;EX06 edge (3, 5) column of M_N = [0, -1, 0, 0, 0]  paper rule -1_(s_p,s_q] = [0, -1, 0, 0, 0]  equal: true&quot;, &quot;EX06 edge (4, 5) column of M_N = [-1, -1, 0, 0, 0]  paper rule -1_(s_p,s_q] = [-1, -1, 0, 0, 0]  equal: true&quot;, &quot;EX06 edge (5, 1) column of M_N = [0, 0, -1, 0, 0]  paper rule -1_(s_p,s_q] = [0, 0, -1, 0, 0]  equal: true&quot;, &quot;EX06 edge (5, 2) column of M_N = [0, 0, -1, -1, 0]  paper rule -1_(s_p,s_q] = [0, 0, -1, -1, 0]  equal: true&quot;], &quot;source&quot;: &quot;Lean output lines, verbatim&quot;}</metadata>
