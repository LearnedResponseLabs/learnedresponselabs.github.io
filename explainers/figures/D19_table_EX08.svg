<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 426" width="560" height="426" role="img" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="currentColor">
<title>Necklace table with the coloop column, EX08</title>
<desc>The necklace of EX08 as Lean evaluates it: row I_r of the paper (Lean row r-1) against the labels x, counted from 1 as in the paper (Lean counts from 0), with the coloop p=3 filled in every row and no crossing edge meeting it; every entry is drawn from Lean's printed output.</desc>
