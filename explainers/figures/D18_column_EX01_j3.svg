<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 242" width="620" height="242" role="img" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="currentColor">
<title>One column of the identity, EX01 column 3</title>
<desc>Column j=3 (the crossing 3&gt;1) of EX01: the column of M_N, its cyclic differences D M, those differences read at the rows s_x to give P_f D M, and the column of B with -1 at the tail and +1 at the head; the printed test PDM=B holds; values are as Lean evaluates them.</desc>
