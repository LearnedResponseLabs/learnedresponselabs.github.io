<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 215" width="700" height="215" role="img" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="currentColor">
<title>Columns of M_N as arcs, EX01</title>
<desc>For each column j of M_N of EX01 (crossing t&gt;h), the rows where Lean's M is -1 (filled, value shown) lie on the arc (s_t,s_h] of the circle of row labels, with the endpoints taken from the printed s_x; this is the instance of Mmat_closed.</desc>
<metadata>{&quot;example&quot;: &quot;EX01&quot;, &quot;lean_lines&quot;: [&quot;S2EX01 window(1-based)=[3, 1, 2] n=3 columns=3&quot;, &quot;S2EX01 s_x (x=1..n)=[2, 3, 1]&quot;, &quot;S2EX01 edgeOf j (j=1..columns, paper labels)=[(1, 2), (2, 3), (3, 1)]&quot;, &quot;EX01 M=[[0, -1, 0], [0, 0, -1], [-1, 0, 0]]&quot;, &quot;S2EX01 arc rows (s_t,s_h] per column j (rows 1-based)=[[3], [1], [2]]&quot;], &quot;source&quot;: &quot;Lean output lines, verbatim&quot;}</metadata>
