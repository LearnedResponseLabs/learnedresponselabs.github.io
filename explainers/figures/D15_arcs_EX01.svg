<text x="158.22" y="125.5" text-anchor="middle" font-size="10" fill="#8a8f98" font-weight="normal" data-l="0">2</text>
<circle cx="49.97" cy="111" r="9" fill="#3a84c4" stroke="currentColor" stroke-width="1.2"/>
<text x="49.97" y="115" text-anchor="middle" font-size="10" fill="currentColor" font-weight="normal" data-l="3" data-cell="2,0">-1</text>
<text x="31.78" y="125.5" text-anchor="middle" font-size="10" fill="#8a8f98" font-weight="normal" data-l="0">3</text>
<text x="95" y="82" text-anchor="middle" font-size="13" fill="currentColor" font-weight="bold" data-l="2" data-pair="1">1&gt;2</text>
<text x="95" y="98" text-anchor="middle" font-size="11" fill="currentColor" font-weight="normal" data-l="2" data-arc="1" data-l2="1">(2,3]</text>
